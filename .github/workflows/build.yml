name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current
      - name: Compile, run core tests, build jars
        run: |
          set -o pipefail
          gradle --no-daemon --console=plain :core:check :gems:assemble 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          # Turn compiler errors into annotations so they show on the commit.
          grep -E '\.java:[0-9]+: (error|warning):' build.log | head -50 | while IFS= read -r line; do
            file="${line%%:*}"; rest="${line#*:}"; ln="${rest%%:*}"; msg="${rest#*: }"
            kind="error"; [[ "$msg" == warning:* ]] && kind="warning"
            echo "::$kind file=${file#$GITHUB_WORKSPACE/},line=$ln::${msg#*: }"
          done
          grep -E '^FAIL ' build.log | while IFS= read -r l; do echo "::error::$l"; done
          exit $status
      - uses: actions/upload-artifact@v4
        with:
          name: jars
          path: gems/build/libs/*.jar
          if-no-files-found: error

  server-test:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mc: ["26.1.2", "26.2", "26.3"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: actions/download-artifact@v4
        with:
          name: jars
          path: jars
      - name: Boot Paper ${{ matrix.mc }} and run the self-test
        run: |
          chmod +x ci/smoke.sh
          JAR=$(ls jars/FacetGems-*.jar | grep -v -- '-Free' | head -1)
          ci/smoke.sh "${{ matrix.mc }}" "$JAR"
      - name: Record result
        if: always()
        run: |
          r=$(cat ci-server/result.txt 2>/dev/null || echo FAIL)
          on=$(cat ci-server/tested-on.txt 2>/dev/null || echo "${{ matrix.mc }} (no build)")
          echo "| ${{ matrix.mc }} | $r | $on |" >> $GITHUB_STEP_SUMMARY
          echo "::notice::Paper ${{ matrix.mc }}: $r ($on)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server-log-${{ matrix.mc }}
          path: ci-server/server.log
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, server-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: jars
          path: jars
      - uses: softprops/action-gh-release@v2
        with:
          files: jars/*.jar
          generate_release_notes: true
